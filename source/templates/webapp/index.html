{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Title</title>
</head>
<body>
    <h1> Калькулятор</h1>
    <div class="input-group mb-3 w-50">
      <span class="input-group-text" id="input_1">Number 1</span>
      <input type="number" class="form-control" id="num_A" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
    </div>
    <div class="input-group mb-3 w-50">
      <span class="input-group-text" id="input_2">Number 2</span>
      <input type="number" class="form-control" id="num_B" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
    </div>
    <div class="input-group mb-3 w-50">
      <span class="input-group-text">Result</span>
       <span class="form-control h2 mb-0" id="result-output"></span>
    </div>
    <button type="button" class="calc-btn btn btn-primary" data-key="/add/">Сложение</button>
     <button type="button" class="calc-btn btn btn-primary" data-key="/subtract/">Вычитание</button>
     <button type="button" class="calc-btn btn btn-primary" data-key="/multiply/">Умножение</button>
     <button type="button" class="calc-btn btn btn-primary" data-key="/divide/">Деление</button>
    <script src="{% static 'js/calculator.js' %}"></script>
</body>
</html>
